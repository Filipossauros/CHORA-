<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CHORA+">
  <!--
    MARCADOR DE POSIÇÃO da mascote. Desenhado à mão em SVG a partir da folha de
    referência, para a maqueta mostrar a escala e a colocação certas. Substituir
    pelo ficheiro definitivo: é trocar este ficheiro, não mexer no CSS.
  -->
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E7BE8"/>
      <stop offset="1" stop-color="#3560D4"/>
    </linearGradient>
  </defs>

  <!-- sombra no chão -->
  <ellipse cx="64" cy="118" rx="34" ry="5" fill="#0F1E3D" opacity=".07"/>

  <!-- tentáculos -->
  <g fill="url(#corpo)">
    <path d="M36 82c-12 2-21 10-23 21-1 6 8 7 9 1 2-8 8-13 16-14z"/>
    <path d="M92 82c12 2 21 10 23 21 1 6-8 7-9 1-2-8-8-13-16-14z"/>
    <path d="M50 100c-8 3-13 10-13 18 0 6 9 6 9 0 0-5 3-9 8-11z"/>
    <path d="M78 100c8 3 13 10 13 18 0 6-9 6-9 0 0-5-3-9-8-11z"/>
    <path d="M62 104c-4 4-6 10-5 16 1 6 9 5 9-1 0-4 0-8 2-11z"/>
    <path d="M74 104c2 3 2 7 2 11 0 6 8 7 9 1 1-6-1-12-5-16z"/>
  </g>

  <!-- camisola -->
  <path d="M40 70h48c4 0 7 3 7 7v18c0 8-7 14-16 14H49c-9 0-16-6-16-14V77c0-4 3-7 7-7z" fill="#17264E"/>
  <!-- sinal + -->
  <g fill="#6CC188">
    <rect x="60" y="78" width="8" height="22" rx="2.5"/>
    <rect x="53" y="85" width="22" height="8" rx="2.5"/>
  </g>

  <!-- cabeça -->
  <ellipse cx="64" cy="45" rx="39" ry="37" fill="url(#corpo)"/>
  <ellipse cx="50" cy="27" rx="15" ry="9" fill="#fff" opacity=".14" transform="rotate(-18 50 27)"/>

  <!-- sobrancelhas -->
  <path d="M38 30c4-3 9-3 13-1" stroke="#1E3E92" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".55"/>
  <path d="M77 29c4-2 9-2 13 1" stroke="#1E3E92" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".55"/>

  <!-- olhos -->
  <ellipse cx="49" cy="46" rx="10" ry="12" fill="#fff"/>
  <ellipse cx="79" cy="46" rx="10" ry="12" fill="#fff"/>
  <circle cx="50" cy="48" r="6.6" fill="#17264E"/>
  <circle cx="80" cy="48" r="6.6" fill="#17264E"/>
  <circle cx="52.4" cy="45" r="2.6" fill="#fff"/>
  <circle cx="82.4" cy="45" r="2.6" fill="#fff"/>
  <circle cx="47.8" cy="51.4" r="1.3" fill="#fff" opacity=".8"/>
  <circle cx="77.8" cy="51.4" r="1.3" fill="#fff" opacity=".8"/>

  <!-- blush -->
  <ellipse cx="33" cy="58" rx="6.5" ry="4" fill="#F2A3A6" opacity=".85"/>
  <ellipse cx="95" cy="58" rx="6.5" ry="4" fill="#F2A3A6" opacity=".85"/>

  <!-- boca -->
  <path d="M58 60c2 3.6 10 3.6 12 0-1.4 4.6-10.6 4.6-12 0z" fill="#E8724C"/>
</svg>
