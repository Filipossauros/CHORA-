<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 224" role="img" aria-label="Choramingas a distribuir pessoas por perfis">
  <!--
    CHORAMINGAS — pose «maestro»: distribui pessoas pelos perfis. MARCADOR DE
    POSIÇÃO. Substituir pelo ficheiro definitivo com este mesmo nome.
    Proporção 396×224; o CSS dimensiona pela largura.
    Usado em: faixa do separador «Afetações».
  -->
  <defs>
    <linearGradient id="cMaestro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E7BE8"/><stop offset="1" stop-color="#3560D4"/>
    </linearGradient>
    <g id="fichaPessoa">
      <rect x="0" y="0" width="96" height="46" rx="8" fill="#fff" stroke="#C9D8F4" stroke-width="2.4"/>
      <circle cx="20" cy="21" r="11" fill="#DCE7FB"/>
      <path d="M20 15.5a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2z" fill="#8FB4F2"/>
      <path d="M11.6 29c1.8-3.4 5-5 8.4-5s6.6 1.6 8.4 5" fill="#8FB4F2"/>
      <rect x="38" y="13" width="30" height="3.6" rx="1.8" fill="#C6D2E8"/>
      <rect x="38" y="21" width="22" height="3.6" rx="1.8" fill="#DCE5F4"/>
      <rect x="74" y="11" width="14" height="14" rx="3.4" fill="#EAF1FE" stroke="#BBD0F5" stroke-width="1.8"/>
      <path d="m77.6 18 2.4 2.4 4.4-5" fill="none" stroke="#3E9A62" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="10" y="35" width="76" height="6" rx="3" fill="#E6EDF8"/>
    </g>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">

  <!-- ── FICHAS À ESQUERDA (por afetar) ──────────────────────────────── -->
  <g opacity=".97">
    <use href="#fichaPessoa" x="2" y="34"/>
    <rect x="12" y="69" width="42" height="6" rx="3" fill="#8FB4F2"/>
    <use href="#fichaPessoa" x="2" y="126"/>
    <rect x="12" y="161" width="30" height="6" rx="3" fill="#8FB4F2"/>
  </g>

  <!-- setas para dentro -->
  <g fill="none" stroke="#6FC79A" stroke-width="3.4" stroke-dasharray="1 8">
    <path d="M104 60c14 6 24 14 30 22"/>
    <path d="M104 150c14-6 24-14 30-22"/>
  </g>
  <g fill="#6FC79A">
    <path d="M133 79l9 6-11 3z"/><path d="M133 131l9-6-11-3z"/>
  </g>

  <!-- ── FICHAS À DIREITA (afetas) ───────────────────────────────────── -->
  <g>
    <use href="#fichaPessoa" x="298" y="26"/>
    <rect x="308" y="61" width="70" height="6" rx="3" fill="#6FC79A"/>
    <use href="#fichaPessoa" x="298" y="132"/>
    <rect x="308" y="167" width="58" height="6" rx="3" fill="#6FC79A"/>
  </g>

  <!-- setas para fora -->
  <g fill="none" stroke="#6FC79A" stroke-width="3.4" stroke-dasharray="1 8">
    <path d="M262 66c12-8 22-14 32-16"/>
  </g>
  <g fill="none" stroke="#F0B44A" stroke-width="3.4" stroke-dasharray="1 8">
    <path d="M262 152c12 8 22 14 32 16"/>
  </g>
  <g><path d="M290 44l10 5-9 5z" fill="#6FC79A"/><path d="M290 176l10-5-9-5z" fill="#F0B44A"/></g>

  <!-- ── CHORAMINGAS ─────────────────────────────────────────────────── -->
  <g transform="translate(134,34)">
    <ellipse cx="64" cy="162" rx="46" ry="6.5" fill="#0F1E3D" opacity=".07"/>

    <!-- batuta -->
    <path d="M52 30 30 6" stroke="#2E4272" stroke-width="4.6" stroke-linecap="round"/>
    <circle cx="29" cy="5" r="4" fill="#2E4272"/>
    <!-- notas e brilhos -->
    <g fill="#F2C14E">
      <path d="M64 2 66 8 72 10 66 12 64 18 62 12 56 10 62 8z"/>
      <circle cx="84" cy="12" r="4"/><rect x="86.6" y="1" width="2.6" height="12" rx="1.3"/>
    </g>

    <!-- tentáculos -->
    <g fill="url(#cMaestro)" stroke="#1B3A86" stroke-width="3">
      <path d="M40 84c-15 2-27 10-32 21-3 6 6 10 9 4 4-9 13-14 23-15z"/>
      <path d="M88 84c15 2 27 10 32 21 3 6-6 10-9 4-4-9-13-14-23-15z"/>
      <path d="M50 34c-8-4-16-2-20 5-3 6 3 10 7 6 3-3 7-4 11-3z"/>
      <path d="M44 132c-9 5-14 14-13 24 1 6 10 5 10-1 0-7 3-13 9-16z"/>
      <path d="M84 132c9 5 14 14 13 24-1 6-10 5-10-1 0-7-3-13-9-16z"/>
      <path d="M60 138c-4 5-6 13-5 21 1 6 10 5 10-1 0-5 0-11 3-14z"/>
      <path d="M74 138c4 5 6 13 5 21-1 6-10 5-10-1 0-5 0-11-3-14z"/>
    </g>

    <!-- camisola -->
    <path d="M36 88h56c6 0 10 4 10 10v22c0 11-9 19-21 19H47c-12 0-21-8-21-19V98c0-6 4-10 10-10z"
          fill="#17264E" stroke="#0E1A38" stroke-width="3"/>
    <path d="M54 88h20l-10 13z" fill="#0E1A38"/>
    <g fill="#6CC188"><rect x="76" y="104" width="7" height="18" rx="2.4"/><rect x="70" y="110" width="19" height="7" rx="2.4"/></g>

    <!-- cabeça -->
    <ellipse cx="64" cy="54" rx="48" ry="45" fill="url(#cMaestro)" stroke="#1B3A86" stroke-width="3.4"/>
    <ellipse cx="45" cy="29" rx="18" ry="10" fill="#fff" opacity=".2" transform="rotate(-20 45 29)"/>

    <path d="M32 38c5-4 12-4 17-1" stroke="#1B3A86" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".6"/>
    <path d="M79 37c5-3 12-3 17 2" stroke="#1B3A86" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".6"/>

    <ellipse cx="47" cy="57" rx="12" ry="14.5" fill="#fff"/>
    <ellipse cx="81" cy="57" rx="12" ry="14.5" fill="#fff"/>
    <circle cx="48" cy="60" r="8.2" fill="#17264E"/>
    <circle cx="82" cy="60" r="8.2" fill="#17264E"/>
    <circle cx="51" cy="56" r="3.2" fill="#fff"/>
    <circle cx="85" cy="56" r="3.2" fill="#fff"/>
    <circle cx="45.4" cy="64" r="1.6" fill="#fff" opacity=".85"/>
    <circle cx="79.4" cy="64" r="1.6" fill="#fff" opacity=".85"/>

    <ellipse cx="26" cy="70" rx="7.6" ry="4.8" fill="#F2A3A6" opacity=".85"/>
    <ellipse cx="102" cy="70" rx="7.6" ry="4.8" fill="#F2A3A6" opacity=".85"/>
    <path d="M56 74c2.6 4.4 13 4.4 15.4 0-1.6 6-13.8 6-15.4 0z" fill="#E8724C"/>
  </g>
  </g>
</svg>
