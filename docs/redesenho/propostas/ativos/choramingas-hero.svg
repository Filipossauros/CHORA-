  <g transform="translate(280,124)">
    <rect x="0" y="0" width="100" height="68" rx="7" fill="#F4F7FC" stroke="#2E4272" stroke-width="3"/>
    <circle cx="21" cy="22" r="12" fill="#F0C84A" stroke="#2E4272" stroke-width="2.4"/>
    <path d="M21 10a12 12 0 0 1 12 12H21z" fill="#5FBF8C" stroke="#2E4272" stroke-width="2.4"/>
    <path d="M42 30 55 18l8 8 14-16" fill="none" stroke="#3E9A62" stroke-width="3.2"/>
    <path d="M71 10h8v8" fill="none" stroke="#3E9A62" stroke-width="3.2"/>
    <g stroke="#2E4272" stroke-width="2.2">
