    <path d="M62 100h24l-12 15z" fill="#0E1A38"/>
    <g fill="#6CC188">
      <rect x="68" y="122" width="11" height="28" rx="3.4"/><rect x="59" y="131" width="29" height="11" rx="3.4"/>
      <rect x="95" y="126" width="7" height="18" rx="2.4"/><rect x="89" y="132" width="19" height="7" rx="2.4"/>
    </g>

    <!-- cabeça -->
    <ellipse cx="74" cy="60" rx="58" ry="54" fill="url(#cHero)" stroke="#1B3A86" stroke-width="3.4"/>
    <ellipse cx="51" cy="30" rx="21" ry="12" fill="#fff" opacity=".2" transform="rotate(-20 51 30)"/>

    <path d="M36 40c6-5 14-5 20-1" stroke="#1B3A86" stroke-width="3.6" stroke-linecap="round" fill="none" opacity=".6"/>
    <path d="M92 39c6-3 14-3 20 2" stroke="#1B3A86" stroke-width="3.6" stroke-linecap="round" fill="none" opacity=".6"/>

    <ellipse cx="53" cy="64" rx="14" ry="17" fill="#fff"/>
    <ellipse cx="95" cy="64" rx="14" ry="17" fill="#fff"/>
    <circle cx="54" cy="67" r="9.6" fill="#17264E"/>
    <circle cx="96" cy="67" r="9.6" fill="#17264E"/>
    <circle cx="57.6" cy="62.5" r="3.8" fill="#fff"/>
    <circle cx="99.6" cy="62.5" r="3.8" fill="#fff"/>
    <circle cx="51" cy="72" r="1.9" fill="#fff" opacity=".85"/>
    <circle cx="93" cy="72" r="1.9" fill="#fff" opacity=".85"/>

    <ellipse cx="28" cy="80" rx="9" ry="5.6" fill="#F2A3A6" opacity=".85"/>
    <ellipse cx="120" cy="80" rx="9" ry="5.6" fill="#F2A3A6" opacity=".85"/>
    <path d="M64 84c3 5 15 5 18 0-2 7-16 7-18 0z" fill="#E8724C"/>
  </g>
  </g>
</svg>
