<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 224" role="img" aria-label="Choramingas com prancheta, cronómetro, pasta e gráfico">
  <!--
    CHORAMINGAS — pose «hero», com os quatro adereços. MARCADOR DE POSIÇÃO.
    Substituir pelo ficheiro definitivo com este mesmo nome. Proporção 396×224
    (landscape); o CSS dimensiona pela largura.
    Usado em: faixa de boas-vindas do ecrã «Hoje».
  -->
  <defs>
    <linearGradient id="cHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E7BE8"/><stop offset="1" stop-color="#3560D4"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">

  <!-- ── PRANCHETA (esquerda) ────────────────────────────────────────── -->
  <g transform="translate(6,34)">
    <rect x="0" y="6" width="62" height="80" rx="6" fill="#fff" stroke="#2E4272" stroke-width="3"/>
    <rect x="20" y="0" width="22" height="12" rx="4" fill="#C6D2E8" stroke="#2E4272" stroke-width="3"/>
    <g>
      <circle cx="15" cy="26" r="6.5" fill="none" stroke="#2FA36B" stroke-width="3"/>
      <path d="m11.6 26 2.6 2.6 4.6-5" fill="none" stroke="#2FA36B" stroke-width="3"/>
      <rect x="27" y="23" width="27" height="3.4" rx="1.7" fill="#BBCBE6"/>
      <rect x="27" y="30" width="19" height="3.4" rx="1.7" fill="#DCE5F4"/>
    </g>
    <g transform="translate(0,20)">
      <circle cx="15" cy="26" r="6.5" fill="none" stroke="#2FA36B" stroke-width="3"/>
      <path d="m11.6 26 2.6 2.6 4.6-5" fill="none" stroke="#2FA36B" stroke-width="3"/>
      <rect x="27" y="23" width="27" height="3.4" rx="1.7" fill="#BBCBE6"/>
      <rect x="27" y="30" width="19" height="3.4" rx="1.7" fill="#DCE5F4"/>
    </g>
    <g transform="translate(0,40)">
      <circle cx="15" cy="26" r="6.5" fill="none" stroke="#2FA36B" stroke-width="3"/>
      <path d="m11.6 26 2.6 2.6 4.6-5" fill="none" stroke="#2FA36B" stroke-width="3"/>
      <rect x="27" y="23" width="27" height="3.4" rx="1.7" fill="#BBCBE6"/>
    </g>
  </g>

  <!-- ── CRONÓMETRO (baixo-esquerda) ─────────────────────────────────── -->
  <g transform="translate(14,124)">
    <rect x="21" y="-8" width="12" height="7" rx="2.5" fill="#E0A93B" stroke="#2E4272" stroke-width="3"/>
    <path d="M40 2 46 -3" stroke="#2E4272" stroke-width="3"/>
    <circle cx="27" cy="26" r="25" fill="#F4F7FC" stroke="#2E4272" stroke-width="3.4"/>
    <circle cx="27" cy="26" r="19" fill="#fff"/>
    <path d="M27 12v14l9 6" fill="none" stroke="#2E4272" stroke-width="3"/>
    <circle cx="27" cy="26" r="2.4" fill="#2E4272"/>
  </g>

  <!-- ── PASTA (direita) ─────────────────────────────────────────────── -->
  <g transform="translate(272,26)">
    <rect x="18" y="6" width="60" height="42" rx="4" fill="#fff" stroke="#2E4272" stroke-width="2.6"/>
    <rect x="24" y="14" width="46" height="3.2" rx="1.6" fill="#C6D2E8"/>
    <rect x="24" y="21" width="38" height="3.2" rx="1.6" fill="#DCE5F4"/>
    <rect x="24" y="28" width="42" height="3.2" rx="1.6" fill="#DCE5F4"/>
    <path d="M4 26h34l7 10h45v42a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V26z" fill="#F0C84A" stroke="#2E4272" stroke-width="3"/>
