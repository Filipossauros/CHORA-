    <rect x="10" y="44" width="22" height="3.4" rx="1.7" fill="#C6D2E8"/>
    <rect x="10" y="52" width="16" height="3.4" rx="1.7" fill="#DCE5F4"/>
  </g>

  <!-- ── CHORAMINGAS ─────────────────────────────────────────────────── -->
  <g transform="translate(112,26)">
    <ellipse cx="74" cy="176" rx="52" ry="7" fill="#0F1E3D" opacity=".07"/>

    <!-- tentáculos que seguram os adereços -->
    <g fill="url(#cHero)" stroke="#1B3A86" stroke-width="3">
      <path d="M32 96c-16 0-30 8-36 20-3 7 6 11 9 5 5-10 15-15 27-15z"/>
      <path d="M116 96c16 0 30 8 36 20 3 7-6 11-9 5-5-10-15-15-27-15z"/>
      <path d="M24 118c-14 4-24 12-28 22-2 6 7 9 9 3 4-9 11-14 21-16z"/>
      <path d="M124 118c14 4 24 12 28 22 2 6-7 9-9 3-4-9-11-14-21-16z"/>
    </g>
    <!-- tentáculos de apoio -->
    <g fill="url(#cHero)" stroke="#1B3A86" stroke-width="3">
      <path d="M44 150c-10 5-16 15-15 26 1 7 11 6 11-1 0-8 3-14 10-18z"/>
      <path d="M104 150c10 5 16 15 15 26-1 7-11 6-11-1 0-8-3-14-10-18z"/>
      <path d="M62 156c-5 6-7 15-5 24 1 7 11 6 11-1 0-6 0-12 3-16z"/>
      <path d="M86 156c5 6 7 15 5 24-1 7-11 6-11-1 0-6 0-12-3-16z"/>
